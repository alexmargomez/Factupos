services:
  db:
    image: mariadb:11.4
    container_name: factupos-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_PASSWORD:-factupos_pass}"
      MARIADB_DATABASE: "${DB_DATABASE:-factupos}"
      MARIADB_USER: "${DB_USERNAME:-factupos_user}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-factupos_pass}"
      MARIADB_TCP_PORT: "3306"
    ports:
      - "${FACTUPOS_DB_PORT:-3309}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "healthcheck.sh --connect --innodb_initialized && SQL=\"ALTER USER 'root'@'localhost' IDENTIFIED VIA unix_socket OR mysql_native_password USING PASSWORD('$${MARIADB_PASSWORD}'); CREATE DATABASE IF NOT EXISTS \\`$${MARIADB_DATABASE}\\`; CREATE USER IF NOT EXISTS '$${MARIADB_USER}'@'%' IDENTIFIED BY '$${MARIADB_PASSWORD}'; ALTER USER '$${MARIADB_USER}'@'%' IDENTIFIED BY '$${MARIADB_PASSWORD}'; GRANT ALL PRIVILEGES ON \\`$${MARIADB_DATABASE}\\`.* TO '$${MARIADB_USER}'@'%'; FLUSH PRIVILEGES;\" && (mariadb -u root -e \"$$SQL\" 2>/dev/null || mariadb -u root -p\"$${MARIADB_ROOT_PASSWORD}\" -e \"$$SQL\" 2>/dev/null || mariadb -u root -p\"$${MARIADB_PASSWORD}\" -e \"$$SQL\" 2>/dev/null || mariadb -u root -p\"root_factupos_pass\" -e \"$$SQL\" 2>/dev/null || true)"
        ]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - factupos-network

  backend:
    build:
      context: ./API_REST
      dockerfile: Dockerfile
    container_name: factupos-backend
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    environment:
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
      APP_NAME: "${APP_NAME:-Factupos}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:${BACKEND_PORT:-8000}}"
      DB_CONNECTION: "${DB_CONNECTION:-mariadb}"
      DB_HOST: "factupos-mariadb"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-factupos}"
      DB_USERNAME: "${DB_USERNAME:-factupos_user}"
      DB_PASSWORD: "${DB_PASSWORD:-factupos_pass}"
      PHP_CLI_SERVER_WORKERS: "${PHP_CLI_SERVER_WORKERS:-4}"
    volumes:
      - ./API_REST:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - factupos-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: factupos-frontend
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    environment:
      FRONTEND_PORT: "${FRONTEND_PORT:-5173}"
      BACKEND_PORT: "${BACKEND_PORT:-8000}"
      VITE_API_URL: "${VITE_API_URL:-/api}"
      VITE_BACKEND_PROXY: "${VITE_BACKEND_PROXY:-http://backend:${BACKEND_PORT:-8000}}"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - factupos-network
    restart: unless-stopped

volumes:
  mariadb_data:
  backend_vendor:
  frontend_node_modules:

networks:
  factupos-network:
    driver: bridge
